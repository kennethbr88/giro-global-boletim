name: Boletim Econômico Diário

on:
  schedule:
    # 11:30 UTC = 08:30 no horário de Brasília (Brasil não tem mais horário
    # de verão desde 2019, então este horário fixo funciona o ano todo).
    - cron: "30 11 * * 1-5"   # segunda a sexta
  workflow_dispatch: {}        # permite rodar manualmente pela aba "Actions"

jobs:
  enviar-boletim:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o boletim
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python boletim.py
